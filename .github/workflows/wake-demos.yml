# Streamlit sleeps demos after 12 h without a browser visit. Visit them every 6 h (GitHub may run this late;
# 6 h leaves margin). A failing run means a demo is broken: GitHub emails you.
# GitHub disables scheduled workflows after 60 days with no commits: re-enable under Actions if that happens.
name: Keep Streamlit demos awake

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: pip install playwright==1.64.1 && python -m playwright install --with-deps chromium
      - run: python tools/wake-demos.py
